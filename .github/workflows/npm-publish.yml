name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release tag matches package version
        if: github.ref_type == 'tag'
        run: node -e "const v = require('./package.json').version; const tag = process.env.GITHUB_REF_NAME; if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== 'v' + v) { console.error('Release tag must equal v' + v + ', got ' + tag); process.exit(1); }"
      - run: npm ci --ignore-scripts
      - run: node tools/sync-version.js --check
      - run: node --test test/releaseNotes.test.js
      - name: Validate current release notes before publishing
        run: node tools/release-notes.js
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: tabby-agentdeck-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # `registry-url` 을 주면 안 된다. setup-node 가 임시 `.npmrc` 에
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` 을 써 넣고
      # `NODE_AUTH_TOKEN` 을 더미값(`XXXXX-XXXXX-XXXXX-XXXXX`)으로 내보내는데,
      # **토큰이 있으면 npm 이 OIDC 교환을 하지 않고** 그 더미로 인증을 시도해
      # `404 PUT /tabby-agentdeck` 로 죽는다 (2026-09-14 run 34800637666 실측:
      # oidc_url·oidc_tok 은 PRESENT 인데 .npmrc 에 _authToken 이 들어 있었다).
      # 기본 레지스트리가 이미 registry.npmjs.org 라 이 줄은 없어도 된다.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      # 경로는 반드시 `./` 로 시작할 것. `package/tabby-agentdeck-1.1.3.tgz` 처럼 주면
      # npm 이 파일이 아니라 **GitHub shorthand(`<org>/<repo>`)** 로 읽어
      # `git ls-remote ssh://git@github.com/package/tabby-agentdeck-1.1.3.tgz.git` 를 때리고
      # `Permission denied (publickey)` 로 죽는다 (2026-09-14 run 34798914763 실측).
      - name: Publish verified archive with OIDC
        run: npm publish ./package/tabby-agentdeck-*.tgz --access public --tag latest --ignore-scripts

  release-notes:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create release notes from the published version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node tools/release-notes.js "$version" "$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release already exists; keeping its published notes."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "AgentDeck $version" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
