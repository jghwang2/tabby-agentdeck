name: Test and build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node tools/sync-version.js --check
      - run: node --test test/releaseNotes.test.js
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
